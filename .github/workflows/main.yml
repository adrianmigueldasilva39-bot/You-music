name: Build Yoi Music

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ps3dev/psl1ght:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          make
          ls -lh *.pkg || ls -lh
      - name: Upload PKG
        uses: actions/upload-artifact@v4
        with:
          name: YoiMusic-pkg
          path: "*.pkg"
